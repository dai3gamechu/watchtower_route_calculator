<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    見張り台 必要数計算ツール
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- ========================================
       ヘッダー
  ========================================= -->

  <header class="hero">

    <div class="hero-content">

      <p class="hero-game">
        DOOMSDAY : LAST SURVIVORS
      </p>

      <h1>
        見張り台 必要数計算ツール
      </h1>
      <p class="version">
        Ver.1.1
      </p>

      <p class="hero-description">
        座標情報をもとに、
        目的地までに必要な見張り台の最小数を計算します。<br>
        あわせて、建設のポイントや推奨建築座標を表示します。
      </p>

    </div>

  </header>


  <!-- ========================================
       スタート地点
  ========================================= -->

  <div class="input-card">

    <h2>
      スタート地点
    </h2>

    <label for="startX">
      X座標
    </label>

    <input
      type="number"
      id="startX"
      inputmode="numeric"
      placeholder="例：724"
    >


    <label for="startY">
      Y座標
    </label>

    <input
      type="number"
      id="startY"
      inputmode="numeric"
      placeholder="例：535"
    >

  </div>


  <!-- ========================================
       目的地
  ========================================= -->

  <div class="input-card">

    <h2>
      目的地
    </h2>

    <label for="destinationX">
      X座標
    </label>

    <input
      type="number"
      id="destinationX"
      inputmode="numeric"
      placeholder="例：724"
    >


    <label for="destinationY">
      Y座標
    </label>

    <input
      type="number"
      id="destinationY"
      inputmode="numeric"
      placeholder="例：565"
    >

  </div>


  <!-- ========================================
       計算ボタン
  ========================================= -->

  <div class="button-card">

    <button
      type="button"
      id="calculateButton"
    >
      計算する
    </button>

  </div>


  <!-- ========================================
       結果
  ========================================= -->

  <div
    id="resultArea"
    aria-live="polite"
  ></div>


  <!-- ========================================
       計算ロジック
  ========================================= -->

  <script src="watchtower-calculator.js"></script>


  <!-- ========================================
       画面表示
  ========================================= -->

  <script>

    "use strict";


    const startXInput =
      document.getElementById(
        "startX"
      );


    const startYInput =
      document.getElementById(
        "startY"
      );


    const destinationXInput =
      document.getElementById(
        "destinationX"
      );


    const destinationYInput =
      document.getElementById(
        "destinationY"
      );


    const calculateButton =
      document.getElementById(
        "calculateButton"
      );


    const resultArea =
      document.getElementById(
        "resultArea"
      );


    // ========================================
    // HTMLエスケープ
    // ========================================

    function escapeHtml(text) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }


    // ========================================
    // 建設ポイントの強調表示
    // ========================================

    function formatGuidanceText(text) {

      return escapeHtml(text)

        .replaceAll(
          "【強調】",
          "<strong>"
        )

        .replaceAll(
          "【/強調】",
          "</strong>"
        );
    }


    // ========================================
    // マス距離の表示
    // ========================================

    function buildDistanceText(
      dx,
      dy
    ) {

      const parts = [];


      if (
        dx > 0
      ) {
        parts.push(
          `右${dx}マス`
        );

      } else if (
        dx < 0
      ) {
        parts.push(
          `左${Math.abs(dx)}マス`
        );
      }


      if (
        dy > 0
      ) {
        parts.push(
          `上${dy}マス`
        );

      } else if (
        dy < 0
      ) {
        parts.push(
          `下${Math.abs(dy)}マス`
        );
      }


      if (
        parts.length === 0
      ) {
        return "同じマス";
      }


      return parts.join("・");
    }


    // ========================================
    // 計算
    // ========================================

    function calculateAndRender() {

      const startX =
        Number(
          startXInput.value
        );


      const startY =
        Number(
          startYInput.value
        );


      const destinationX =
        Number(
          destinationXInput.value
        );


      const destinationY =
        Number(
          destinationYInput.value
        );


      // --------------------------------------
      // 未入力チェック
      // --------------------------------------

      if (
        startXInput.value.trim() === "" ||
        startYInput.value.trim() === "" ||
        destinationXInput.value.trim() === "" ||
        destinationYInput.value.trim() === ""
      ) {

        resultArea.innerHTML = `
          <section>
            <p>
              すべての座標を入力してください。
            </p>
          </section>
        `;

        return;
      }


      // --------------------------------------
      // 数値チェック
      // --------------------------------------

      if (
        !Number.isFinite(startX) ||
        !Number.isFinite(startY) ||
        !Number.isFinite(destinationX) ||
        !Number.isFinite(destinationY)
      ) {

        resultArea.innerHTML = `
          <section>
            <p>
              座標には数値を入力してください。
            </p>
          </section>
        `;

        return;
      }


      try {

        const result =
          WatchtowerCalculator.calculate(
            startX,
            startY,
            destinationX,
            destinationY
          );


        // ------------------------------------
        // すでに接している
        // ------------------------------------

        if (
          result.status ===
          "already_connected"
        ) {

          resultArea.innerHTML = `
            <section>
              <h2>
                計算結果
              </h2>

              <p>
                ${escapeHtml(
                  result.message
                )}
              </p>
            </section>
          `;

          return;
        }


        // ------------------------------------
        // 通常結果
        // ------------------------------------

        let html = "";


        html += `
          <section>

            <h2>
              必要な見張り台
            </h2>

            <p>
              <strong>
                ${result.count}個
              </strong>
            </p>

          </section>
        `;


        html += `
          <section>

            <h3>
              目的地までの距離
            </h3>

            <p>
              ${escapeHtml(
                buildDistanceText(
                  result.dx,
                  result.dy
                )
              )}
            </p>

          </section>
        `;


        // ------------------------------------
        // 建設のポイント
        // ------------------------------------

        if (
          result.guidance.length > 0
        ) {

          html += `
            <section>

              <h3>
                建設のポイント
              </h3>

              <ul>
          `;


          for (
            const note
            of result.guidance
          ) {

            html += `
              <li>
                ${formatGuidanceText(
                  note
                )}
              </li>
            `;
          }


          html += `
              </ul>

            </section>
          `;
        }


        // ------------------------------------
        // 推奨建築座標
        // ------------------------------------

        if (
          result.routeCoordinates.length > 0
        ) {

          html += `
            <section>

              <h3>
                推奨建築座標
              </h3>

              <ol>
          `;


          for (
            const point
            of result.routeCoordinates
          ) {

            html += `
              <li>
                X${point.x} / Y${point.y}
              </li>
            `;
          }


          html += `
              </ol>

            </section>
          `;
        }


        // ------------------------------------
        // 注意書き
        // ------------------------------------

        html += `
          <aside class="result-note">

            <p>
              ※この結果は、座標をもとに机上で計算したものです。
              マップ内の障害物は考慮していないため、
              実際には推奨ルートで建設できない場合があります。
              あらかじめご了承ください。
            </p>

          </aside>
        `;


        resultArea.innerHTML =
          html;


      } catch (error) {

        console.error(
          error
        );


        resultArea.innerHTML = `
          <section>
            <p>
              計算中にエラーが発生しました。
            </p>
          </section>
        `;
      }
    }


    // ========================================
    // ボタン
    // ========================================

    calculateButton.addEventListener(
      "click",
      calculateAndRender
    );


    // ========================================
    // Enterでも計算
    // ========================================

    const inputs = [
      startXInput,
      startYInput,
      destinationXInput,
      destinationYInput,
    ];


    for (
      const input
      of inputs
    ) {

      input.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Enter"
          ) {
            calculateAndRender();
          }
        }
      );
    }

  </script>

</body>

</html>
